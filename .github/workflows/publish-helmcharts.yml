name: Helm Package and Push

on:
  push:
    branches:
      - feat/github-action

jobs:
  package-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Debug repo structure
        run: |
          pwd
          ls -l
          ls -l charts

      - name: Package Helm charts
        run: |
          mkdir -p ./packages
          echo "Found charts:"
          ls -d ./charts/*/
          for chart_dir in ./charts/*/; do
            echo "Packaging chart: $chart_dir"
            helm package "$chart_dir" -d ./packages
          done

      - name: Commit and push packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ./packages/*
          git commit -m "Add packaged charts"
          git push origin feat/github-action
