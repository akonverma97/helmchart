name: Publish Helm Charts

on:
  push:
    branches:
      - feat/github-action  # ya aapki main working branch

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Helm
        uses: azure/setup-helm@v3

      - name: Package Helm charts
        run: |
          mkdir -p packages
          helm package charts/cronjob -d packages
          helm package charts/helmchart -d packages
          helm package charts/rbac -d packages
          helm package charts/vigil -d packages

      - name: Create Helm repo index
        run: |
          helm repo index packages --url https://akonverma97.github.io/helmchart
          mv packages/index.yaml .

      - name: Setup git user
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages

      - name: Switch to gh-pages branch
        run: git checkout gh-pages

      - name: Copy packaged charts and index.yaml
        run: |
          rm -rf ./*
          cp -r packages/* ./

      - name: Commit and push changes
        run: |
          git add .
          git commit -m "Publish Helm charts from GitHub Actions [skip ci]" || echo "No changes to commit"
          git push origin gh-pages

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
