name: Publish Helm Charts

on:
  push:
    branches:
      - feat/github-action 

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        clean: true   

    - name: Reset any local changes
      run: git reset --hard

    - name: Set up Helm
      uses: azure/setup-helm@v1

    - name: Package Helm charts
      run: |
        mkdir -p packages
        helm package ./charts/* -d packages/

    - name: Index Helm repo
      run: |
        helm repo index packages --url https://akonverma97.github.io/helmchart
        mv packages/index.yaml .

    - name: Commit and push changes to gh-pages
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git fetch origin gh-pages || git checkout --orphan gh-pages
        git checkout gh-pages
        git rm -rf .
        cp -r packages/* .
        git add .
        git commit -m "Publish Helm charts from ${{ github.ref_name }} [skip ci]" || echo "No changes to commit"
        git push origin gh-pages
