name: Publish Helm Charts

on:
  push:
    branches:
      - feat/github-action   

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Package Helm charts
        run: |
          mkdir -p packages
          helm package ./charts/cronjob -d packages
          helm package ./charts/helmchart -d packages
          helm package ./charts/rbac -d packages
          helm package ./charts/vigil -d packages
          helm package ./charts/cloudflare-ddns -d packages
          helm package ./charts/cloudflared-tunnel -d packages

      - name: Create Helm repo index
        run: |
          helm repo index packages --url https://akonverma97.github.io/helmchart

      - name: Setup git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push Helm charts and index.yaml to gh-pages branch
        run: |
          git fetch origin gh-pages || git checkout --orphan gh-pages
          git checkout gh-pages
          rm -rf *
          cp -r packages/* .
          cp packages/index.yaml .
          git add .
          git commit -m "Publish Helm charts from ${{ github.ref_name }} [skip ci]" || echo "No changes to commit"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
