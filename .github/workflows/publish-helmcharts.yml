name: Publish Helm Charts

on:
  push:
    branches:
      - feat/github-action  # ✅ Your current working branch
    paths:
      - 'charts/**'
      - '.github/workflows/**'

  workflow_dispatch:  # ✅ Allows manual runs from GitHub UI

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Create output folder for chart packages
        run: mkdir -p ./helmchart/packages

      - name: Package all Helm charts
        run: |
          for dir in ./helmchart/charts/*/; do
            echo "Packaging chart: $dir"
            helm package "$dir" -d ./helmchart/packages
          done

      - name: Copy artifacthub-repo.yaml (if exists)
        run: |
          if [ -f helmchart/artifacthub-repo.yaml ]; then
            cp helmchart/artifacthub-repo.yaml helmchart/packages/
          fi

      - name: Rebuild Helm index.yaml
        run: |
          helm repo index ./helmchart/packages \
            --url https://akonverma97.github.io/helmchart \
            --merge ./helmchart/index.yaml || true

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./helmchart/packages
          force_orphan: true  # Optional: overwrites old files

